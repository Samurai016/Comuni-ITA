openapi: 3.0.1
info:
  title: Comuni ITA
  description: >-
    Semplice API che permette di ottenere i comuni italiani in formato JSON, XML o CSV.


    Dalla 5.0.0 gli endpoint sono versionati, ed è la `/v5` la strada da prendere per
    il codice nuovo: è quella documentata qui sotto per prima. L'unica differenza
    rispetto alla `/v4` è il campo `cap` dei comuni, che diventa una lista.


    Le rotte storiche senza prefisso continuano a funzionare come sempre e servono la
    `/v4`; rispondono con gli header `Deprecation: true` e `Link`, che rimanda alla
    rotta `/v4` corrispondente. Le tre forme sono `/comuni`, `/v4/comuni` e
    `/v5/comuni`, e così per province e regioni.


    Dalla 5.1.0 la `/v5` serve anche i comuni cessati, su `/v5/comuni/cessati`. La
    `/v4` non li ha: è la versione di sempre e resta tale.


    *Logo ispired by: [Castle by Jasfart from the Noun
    Project](https://thenounproject.com/omataloon/)*
  version: 5.1.0
  x-logo:
    url: ./logo.png
    altText: Comuni ITA Logo
  contact:
    name: Nicolò Rebaioli
    email: niko.reba@gmail.com
    url: https://nicolorebaioli.dev
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
externalDocs:
  description: Github
  url: https://github.com/Samurai016/Comuni-ITA
servers:
  - url: https://comuni-ita.nicolorebaioli.dev
# L'API è pubblica e non richiede autenticazione
security: []
tags:
  - name: servizio
    description: Endpoint di servizio
  - name: comuni
    description: Endpoint che restituiscono comuni
  - name: province
    description: Endpoint che restituiscono province
  - name: regioni
    description: Endpoint che restituiscono regioni
paths:
  /:
    get:
      summary: Verifica che l'API risponda e scopri le versioni disponibili.
      operationId: root
      tags:
        - servizio
      responses:
        '200':
          description: L'API è in esecuzione.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Comuni-ITA API is running!
                  datasetVersion:
                    type: string
                    description: Versione del dataset caricato, `N/A` se non dichiarata.
                    example: N/A
                  versions:
                    type: array
                    items:
                      type: string
                    example: ['v4', 'v5']
                  latestVersion:
                    type: string
                    example: v5
        5XX:
          $ref: '#/components/responses/ServerError'
  /v5/comuni:
    parameters:
      - $ref: '#/components/parameters/format'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pagesize'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/q_comune'
      - $ref: '#/components/parameters/codice_comune'
      - $ref: '#/components/parameters/codiceCatastale_comune'
      - $ref: '#/components/parameters/cap_comune'
      - $ref: '#/components/parameters/prefisso_comune'
      - $ref: '#/components/parameters/provincia_comune'
      - $ref: '#/components/parameters/regione_comune'
    get:
      summary: Ottieni la lista di tutti i comuni italiani.
      description: >-
        Come `/comuni`, ma il campo `cap` è una lista.
      operationId: comuni-v5
      tags:
        - comuni
      responses:
        '200':
          $ref: '#/components/responses/ComuniV5'
        '400':
          $ref: '#/components/responses/BadRequest'
        5XX:
          $ref: '#/components/responses/ServerError'
  /v5/comuni/cessati:
    parameters:
      - $ref: '#/components/parameters/format'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pagesize'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/q_cessato'
      - $ref: '#/components/parameters/codice_cessato'
      - $ref: '#/components/parameters/codiceCatastale_cessato'
      - $ref: '#/components/parameters/provincia_cessato'
      - $ref: '#/components/parameters/regione_cessato'
      - $ref: '#/components/parameters/cessatoDal'
      - $ref: '#/components/parameters/cessatoAl'
      - $ref: '#/components/parameters/soppresso'
    get:
      summary: Ottieni la lista dei comuni italiani cessati.
      description: >-
        I comuni che non esistono più con il nome, il codice o la provincia con
        cui sono qui descritti: serve a riconoscere un luogo di nascita che sulle
        carte c'è ancora ma sul territorio no.


        Un record non è un comune, è un'identità: il comune che è stato
        rinominato, che è passato a un'altra provincia o che è confluito in uno
        nuovo ne lascia uno dietro di sé, e lo stesso comune può quindi comparire
        più volte. A dire quale delle due cose è successa è `comuneAttuale`:
        quando c'è, il comune esiste ancora sotto altro nome o altra provincia;
        quando è `null`, il comune è stato soppresso e nessun comune di oggi ne
        porta il codice catastale.


        La rotta esiste solo in `/v5`: la `/v4` resta quella di sempre.
      operationId: comuni-cessati-v5
      tags:
        - comuni
      responses:
        '200':
          $ref: '#/components/responses/ComuniCessati'
        '400':
          $ref: '#/components/responses/BadRequest'
        5XX:
          $ref: '#/components/responses/ServerError'
  /v5/comuni/{regione}:
    parameters:
      - $ref: '#/components/parameters/regione'
      - $ref: '#/components/parameters/format'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pagesize'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/q_comune'
      - $ref: '#/components/parameters/codice_comune'
      - $ref: '#/components/parameters/codiceCatastale_comune'
      - $ref: '#/components/parameters/cap_comune'
      - $ref: '#/components/parameters/prefisso_comune'
      - $ref: '#/components/parameters/provincia_comune'
    get:
      summary: Ottieni la lista di tutti i comuni della regione indicata.
      description: >-
        Come `/comuni/{regione}`, ma il campo `cap` è una lista.
      operationId: comuni-regione-v5
      tags:
        - comuni
      responses:
        '200':
          $ref: '#/components/responses/ComuniV5'
        '400':
          $ref: '#/components/responses/BadRequest'
        5XX:
          $ref: '#/components/responses/ServerError'
  /v5/comuni/provincia/{provincia}:
    parameters:
      - $ref: '#/components/parameters/provincia'
      - $ref: '#/components/parameters/format'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pagesize'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/q_comune'
      - $ref: '#/components/parameters/codice_comune'
      - $ref: '#/components/parameters/codiceCatastale_comune'
      - $ref: '#/components/parameters/cap_comune'
      - $ref: '#/components/parameters/prefisso_comune'
    get:
      summary: Ottieni la lista di tutti i comuni della provincia indicata.
      description: >-
        Come `/comuni/provincia/{provincia}`, ma il campo `cap` è una lista.
      operationId: comuni-provincia-v5
      tags:
        - comuni
      responses:
        '200':
          $ref: '#/components/responses/ComuniV5'
        '400':
          $ref: '#/components/responses/BadRequest'
        5XX:
          $ref: '#/components/responses/ServerError'
  /v5/province:
    parameters:
      - $ref: '#/components/parameters/format'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pagesize'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/codice_provincia'
      - $ref: '#/components/parameters/sigla_provincia'
      - $ref: '#/components/parameters/regione_provincia'
    get:
      summary: Ottieni la lista di tutte le province italiane.
      description: >-
        Identica sulle rotte `/v4/...` e su quelle storiche senza prefisso:
        province e regioni non cambiano fra le versioni.
      operationId: province-v5
      tags:
        - province
      responses:
        '200':
          $ref: '#/components/responses/Province'
        '400':
          $ref: '#/components/responses/BadRequest'
        5XX:
          $ref: '#/components/responses/ServerError'
  /v5/province/{regione}:
    parameters:
      - $ref: '#/components/parameters/regione'
      - $ref: '#/components/parameters/format'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pagesize'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/codice_provincia'
      - $ref: '#/components/parameters/sigla_provincia'
    get:
      summary: Ottieni la lista di tutte le province della regione indicata.
      description: >-
        Identica sulle rotte `/v4/...` e su quelle storiche senza prefisso:
        province e regioni non cambiano fra le versioni.
      operationId: province-regione-v5
      tags:
        - province
      responses:
        '200':
          $ref: '#/components/responses/Province'
        '400':
          $ref: '#/components/responses/BadRequest'
        5XX:
          $ref: '#/components/responses/ServerError'
  /v5/regioni:
    parameters:
      - $ref: '#/components/parameters/format'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pagesize'
    get:
      summary: Ottieni la lista di tutte le regioni italiane.
      description: >-
        Identica sulle rotte `/v4/...` e su quelle storiche senza prefisso:
        province e regioni non cambiano fra le versioni.
      operationId: regioni-v5
      tags:
        - regioni
      responses:
        '200':
          $ref: '#/components/responses/Regioni'
        '400':
          $ref: '#/components/responses/BadRequest'
        5XX:
          $ref: '#/components/responses/ServerError'
  /comuni:
    parameters:
      - $ref: '#/components/parameters/format'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pagesize'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/q_comune'
      - $ref: '#/components/parameters/codice_comune'
      - $ref: '#/components/parameters/codiceCatastale_comune'
      - $ref: '#/components/parameters/cap_comune'
      - $ref: '#/components/parameters/prefisso_comune'
      - $ref: '#/components/parameters/provincia_comune'
      - $ref: '#/components/parameters/regione_comune'
    get:
      summary: Ottieni la lista di tutti i comuni italiani, con un CAP solo.
      description: >-
        Rotta storica: serve la v4, dove `cap` è una stringa sola. Risponde con
        gli header `Deprecation: true` e `Link`, che rimanda alla rotta `/v4`
        corrispondente: identica in tutto, ma senza quegli header. Continua a
        funzionare, per il codice nuovo conviene la `/v5`.
      deprecated: true
      operationId: comuni
      tags:
        - comuni
      responses:
        '200':
          $ref: '#/components/responses/ComuniV4'
        '400':
          $ref: '#/components/responses/BadRequest'
        5XX:
          $ref: '#/components/responses/ServerError'
  /comuni/{regione}:
    parameters:
      - $ref: '#/components/parameters/regione'
      - $ref: '#/components/parameters/format'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pagesize'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/q_comune'
      - $ref: '#/components/parameters/codice_comune'
      - $ref: '#/components/parameters/codiceCatastale_comune'
      - $ref: '#/components/parameters/cap_comune'
      - $ref: '#/components/parameters/prefisso_comune'
      - $ref: '#/components/parameters/provincia_comune'
    get:
      summary: Ottieni la lista di tutti i comuni della regione indicata, con un CAP solo.
      description: >-
        Rotta storica: serve la v4, dove `cap` è una stringa sola. Risponde con
        gli header `Deprecation: true` e `Link`, che rimanda alla rotta `/v4`
        corrispondente: identica in tutto, ma senza quegli header. Continua a
        funzionare, per il codice nuovo conviene la `/v5`.
      deprecated: true
      operationId: comuni-regione
      tags:
        - comuni
      responses:
        '200':
          $ref: '#/components/responses/ComuniV4'
        '400':
          $ref: '#/components/responses/BadRequest'
        5XX:
          $ref: '#/components/responses/ServerError'
  /comuni/provincia/{provincia}:
    parameters:
      - $ref: '#/components/parameters/provincia'
      - $ref: '#/components/parameters/format'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pagesize'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/q_comune'
      - $ref: '#/components/parameters/codice_comune'
      - $ref: '#/components/parameters/codiceCatastale_comune'
      - $ref: '#/components/parameters/cap_comune'
      - $ref: '#/components/parameters/prefisso_comune'
    get:
      summary: Ottieni la lista di tutti i comuni della provincia indicata, con un CAP solo.
      description: >-
        Rotta storica: serve la v4, dove `cap` è una stringa sola. Risponde con
        gli header `Deprecation: true` e `Link`, che rimanda alla rotta `/v4`
        corrispondente: identica in tutto, ma senza quegli header. Continua a
        funzionare, per il codice nuovo conviene la `/v5`.
      deprecated: true
      operationId: comuni-provincia
      tags:
        - comuni
      responses:
        '200':
          $ref: '#/components/responses/ComuniV4'
        '400':
          $ref: '#/components/responses/BadRequest'
        5XX:
          $ref: '#/components/responses/ServerError'
  /province:
    parameters:
      - $ref: '#/components/parameters/format'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pagesize'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/codice_provincia'
      - $ref: '#/components/parameters/sigla_provincia'
      - $ref: '#/components/parameters/regione_provincia'
    get:
      summary: Ottieni la lista di tutte le province italiane.
      description: >-
        Rotta storica. Province e regioni sono identiche in tutte le versioni,
        quindi la risposta è la stessa della `/v5`; cambiano solo gli header
        `Deprecation` e `Link`, che rimandano alla rotta `/v4` corrispondente.
      deprecated: true
      operationId: province
      tags:
        - province
      responses:
        '200':
          $ref: '#/components/responses/Province'
        '400':
          $ref: '#/components/responses/BadRequest'
        5XX:
          $ref: '#/components/responses/ServerError'
  /province/{regione}:
    parameters:
      - $ref: '#/components/parameters/regione'
      - $ref: '#/components/parameters/format'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pagesize'
      - $ref: '#/components/parameters/sort'
      - $ref: '#/components/parameters/fields'
      - $ref: '#/components/parameters/codice_provincia'
      - $ref: '#/components/parameters/sigla_provincia'
    get:
      summary: Ottieni la lista di tutte le province della regione indicata.
      description: >-
        Rotta storica. Province e regioni sono identiche in tutte le versioni,
        quindi la risposta è la stessa della `/v5`; cambiano solo gli header
        `Deprecation` e `Link`, che rimandano alla rotta `/v4` corrispondente.
      deprecated: true
      operationId: province-regione
      tags:
        - province
      responses:
        '200':
          $ref: '#/components/responses/Province'
        '400':
          $ref: '#/components/responses/BadRequest'
        5XX:
          $ref: '#/components/responses/ServerError'
  /regioni:
    parameters:
      - $ref: '#/components/parameters/format'
      - $ref: '#/components/parameters/page'
      - $ref: '#/components/parameters/pagesize'
    get:
      summary: Ottieni la lista di tutte le regioni italiane.
      description: >-
        Rotta storica. Province e regioni sono identiche in tutte le versioni,
        quindi la risposta è la stessa della `/v5`; cambiano solo gli header
        `Deprecation` e `Link`, che rimandano alla rotta `/v4` corrispondente.
      deprecated: true
      operationId: regioni
      tags:
        - regioni
      responses:
        '200':
          $ref: '#/components/responses/Regioni'
        '400':
          $ref: '#/components/responses/BadRequest'
        5XX:
          $ref: '#/components/responses/ServerError'

components:
  responses:
    ComuniV4:
      description: L'operazione ha avuto successo.
      headers:
        Deprecation:
          description: >-
            Presente, con valore `true`, solo sui percorsi senza prefisso di versione.
          schema:
            type: string
        Link:
          description: >-
            Presente insieme a `Deprecation`, indica la rotta `/v4` corrispondente.
          schema:
            type: string
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Comune'
        application/xml:
          schema:
            $ref: '#/components/schemas/ComuniXML'
        text/csv:
          schema:
            $ref: '#/components/schemas/ComuniCSV'
    ComuniV5:
      description: L'operazione ha avuto successo.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ComuneV5'
        application/xml:
          schema:
            $ref: '#/components/schemas/ComuniXMLV5'
        text/csv:
          schema:
            $ref: '#/components/schemas/ComuniCSVV5'
    ComuniCessati:
      description: L'operazione ha avuto successo.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ComuneCessato'
        application/xml:
          schema:
            $ref: '#/components/schemas/ComuniCessatiXML'
        text/csv:
          schema:
            $ref: '#/components/schemas/ComuniCessatiCSV'
    Regioni:
      description: L'operazione ha avuto successo.
      content:
        application/json:
          schema:
            type: array
            items:
              type: string
              example: Trentino Alto Adige
        application/xml:
          schema:
            type: object
            xml:
              name: regioni
            properties:
              page:
                xml:
                  attribute: true
                type: integer
              pagesize:
                xml:
                  attribute: true
                type: integer
              total:
                xml:
                  attribute: true
                type: integer
              regioni:
                type: array
                xml:
                  name: regione
                items:
                  type: string
        text/csv:
          schema:
            type: string
    Province:
      description: L'operazione ha avuto successo.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Provincia'
        application/xml:
          schema:
            type: object
            xml:
              name: province
            properties:
              page:
                xml:
                  attribute: true
                type: integer
              pagesize:
                xml:
                  attribute: true
                type: integer
              total:
                xml:
                  attribute: true
                type: integer
              province:
                type: array
                xml:
                  name: provincia
                items:
                  $ref: '#/components/schemas/Provincia'
        text/csv:
          schema:
            type: string
            example: |-
              codice,nome,sigla,regione
              021,Bolzano,BZ,Trentino Alto Adige
    BadRequest:
      description: >-
        Uno dei parametri non è valido. Il messaggio dice quale.
      content:
        application/json:
          schema:
            type: object
            properties:
              statusCode:
                type: integer
                example: 400
              code:
                type: string
                example: FST_ERR_VALIDATION
              error:
                type: string
                example: Bad Request
              message:
                type: string
                example: querystring/page must be >= 1
    ServerError:
      description: Errore del server. **Contattare lo sviluppatore.**
  parameters:
    provincia:
      in: path
      name: provincia
      required: true
      schema:
        type: string
      description: |-
        Nome della provincia di cui si vogliono i dati.
        Il parametro è case insensitive.
      example: l'aquila
    regione:
      in: path
      name: regione
      required: true
      schema:
        type: string
      description: |-
        Nome della regione di cui si vogliono i dati.
        Il parametro è case insensitive.
      example: valle d'aosta
    q_comune:
      in: query
      name: q
      schema:
        type: string
      description: >-
        Nome del comune da cercare, anche parziale e senza badare a maiuscole e
        accenti. Cerca sia nel nome italiano sia in quello straniero: `bozen`
        restituisce Bolzano.
      example: bolzano
    codice_comune:
      in: query
      name: codice
      schema:
        type: string
      description: >-
        Codice ISTAT esatto del comune. `021008` restituisce Bolzano, `021` non
        restituisce nulla.
      example: '021008'
    codiceCatastale_comune:
      in: query
      name: codiceCatastale
      schema:
        type: string
      description: >-
        Codice catastale esatto del comune. `A952` restituisce Bolzano, `A9` non
        restituisce nulla.
      example: A952
    cap_comune:
      in: query
      name: cap
      schema:
        type: string
        pattern: \d{5}
      description: >-
        CAP esatto del comune. La ricerca viene fatta fra tutti i CAP di un
        comune, quelli storici compresi, quindi un comune corrisponde anche a un
        CAP che non compare nella sua risposta. Lo stesso CAP può appartenere a
        più comuni.
      example: '20143'
    prefisso_comune:
      in: query
      name: prefisso
      schema:
        type: string
      description: Prefisso telefonico esatto del comune.
      example: '0471'
    provincia_comune:
      in: query
      name: provincia
      schema:
        type: string
      description: >-
        Nome esatto della provincia, case insensitive.
      example: bolzano
    regione_comune:
      in: query
      name: regione
      schema:
        type: string
      description: >-
        Nome esatto della regione, case insensitive.
      example: trentino alto adige
    q_cessato:
      in: query
      name: q
      schema:
        type: string
      description: >-
        Nome del comune cessato da cercare, anche parziale e senza badare a
        maiuscole e accenti. Cerca sia nel nome italiano sia in quello straniero.
      example: castegnero
    codice_cessato:
      in: query
      name: codice
      schema:
        type: string
      description: >-
        Codice ISTAT esatto. Lo stesso codice è stato assegnato negli anni a
        comuni diversi, quindi può restituire più di un comune cessato.
      example: '024027'
    codiceCatastale_cessato:
      in: query
      name: codiceCatastale
      schema:
        type: string
        pattern: '[A-Z]\d{3}'
      description: >-
        Codice catastale esatto. È il campo con cui si riconosce un luogo di
        nascita, ed è condiviso da tutte le identità dello stesso comune: `C056`
        restituisce Castegnero. I comuni cessati che un codice catastale non
        l'hanno mai avuto non rispondono a nessun valore.
      example: C056
    provincia_cessato:
      in: query
      name: provincia
      schema:
        type: string
      description: >-
        Nome o sigla esatti della provincia, case insensitive. La sigla serve per
        le province che non esistono più, di cui l'API non conosce il nome:
        `PL` restituisce i comuni della provincia di Pola.
      example: vicenza
    regione_cessato:
      in: query
      name: regione
      schema:
        type: string
      description: >-
        Nome esatto della regione, case insensitive. I comuni dei territori
        ceduti dopo la guerra non hanno una regione e non rispondono a nessun
        valore.
      example: veneto
    cessatoDal:
      in: query
      name: cessatoDal
      schema:
        type: string
        format: date
      description: Tiene solo i comuni cessati a partire da questa data, inclusa.
      example: '2026-01-01'
    cessatoAl:
      in: query
      name: cessatoAl
      schema:
        type: string
        format: date
      description: Tiene solo i comuni cessati fino a questa data, inclusa.
      example: '2026-12-31'
    soppresso:
      in: query
      name: soppresso
      schema:
        type: boolean
      description: >-
        `true` tiene solo i comuni soppressi, quelli con `comuneAttuale` a
        `null`; `false` solo quelli che un comune di oggi lo hanno. Se omesso, la
        risposta contiene gli uni e gli altri.
      example: true
    codice_provincia:
      in: query
      name: codice
      schema:
        type: string
      description: >-
        Codice ISTAT esatto della provincia. `021` restituisce Bolzano, `21` non
        restituisce nulla.
      example: '021'
    sigla_provincia:
      in: query
      name: sigla
      schema:
        type: string
        pattern: '[A-Z]{2}'
      description: Sigla esatta della provincia, in maiuscolo.
      example: BZ
    regione_provincia:
      in: query
      name: regione
      schema:
        type: string
      description: Nome esatto della regione, case insensitive.
      example: trentino alto adige
    format:
      in: query
      name: format
      schema:
        type: string
        enum: ["json", "xml", "csv"]
        default: "json"
      description: >-
        Formato dell'output. Va scritto in minuscolo: `CSV` viene rifiutato.
    sort:
      in: query
      name: sort
      schema:
        type: string
      description: >-
        Campo su cui ordinare. Anteponi `-` per l'ordine decrescente, ad esempio
        `-popolazione`. Un campo che non esiste lascia l'ordine invariato.
      example: nome
    fields:
      in: query
      name: fields
      schema:
        type: string
      description: >-
        Elenco separato da virgole dei campi da restituire. Gli altri vengono
        omessi.
      example: nome,codice,cap
    page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        default: 1
      description: >-
        Indice della pagina, a partire da 1. Ha effetto solo insieme a `pagesize`.
    pagesize:
      in: query
      name: pagesize
      schema:
        type: integer
        minimum: 1
      description: >-
        Numero di elementi per pagina. Se omesso, la risposta contiene tutti i
        risultati.
  schemas:
    Comune:
      type: object
      properties:
        codice:
          type: string
          description: Codice ISTAT del comune.
          example: '021008'
        nome:
          type: string
          description: Nome del comune.
          example: Bolzano
        nomeStraniero:
          type: string
          nullable: true
          description: Nome straniero del comune, `null` se non ne ha uno.
          example: Bozen
        codiceCatastale:
          type: string
          description: Codice catastale del comune.
          example: A952
          pattern: '[A-Z]\d{3}'
        cap:
          type: string
          description: >-
            CAP del comune. I pochi comuni che ne hanno più di uno espongono qui
            quello della sede comunale; per averli tutti usa `/v5`.
          example: '39100'
          pattern: \d{5}
        prefisso:
          type: string
          description: Prefisso telefonico del comune.
          example: '0471'
          pattern: \d{2,5}
        provincia:
          $ref: '#/components/schemas/Provincia'
        email:
          type: string
          format: email
          nullable: true
          description: >-
            Email ordinaria del comune, dall'elenco del Ministero dell'Interno o
            dall'Indice dei domicili digitali della PA. Il dato arriva dalle
            amministrazioni: può essere malformato o assente. Segnalando
            un'anomalia allo sviluppatore viene corretta.
          example: urp@comune.bolzano.it
        pec:
          type: string
          format: email
          nullable: true
          description: >-
            Email PEC del comune, dalle stesse fonti e con le stesse riserve
            dell'email ordinaria.
          example: bolzano@legalmail.it
        telefono:
          type: string
          nullable: true
          description: >-
            Numero di telefono del comune, dalle stesse fonti e con le stesse
            riserve dell'email ordinaria.
          example: '+39 0471 997111'
        fax:
          type: string
          nullable: true
          description: >-
            Numero di fax del comune, dalle stesse fonti e con le stesse riserve
            dell'email ordinaria.
          example: '+39 0471 997 404'
        popolazione:
          type: integer
          description: Numero di abitanti, dall'ultima rilevazione ISTAT disponibile.
          example: 106901
        coordinate:
          type: object
          description: Coordinate del municipio.
          properties:
            lat:
              type: number
              description: Latitudine
              example: 46.498113
            lng:
              type: number
              description: Longitudine
              example: 11.35478
    ComuneV5:
      allOf:
        - $ref: '#/components/schemas/Comune'
        - type: object
          properties:
            cap:
              type: array
              description: >-
                Tutti i CAP del comune, in lista anche quando è uno solo. Il
                primo è quello della sede comunale.
              items:
                type: string
                pattern: \d{5}
              example: ['38122', '38121', '38123']
    ComuneCessato:
      type: object
      properties:
        id:
          type: integer
          description: >-
            Identificativo ANPR del record, stabile fra un aggiornamento e
            l'altro. È l'unico campo che identifica una singola identità: né il
            codice ISTAT né quello catastale lo fanno.
          example: 2228
        codice:
          type: string
          description: >-
            Codice ISTAT che il comune aveva quando è cessato. Lo stesso codice
            è stato riassegnato negli anni a comuni diversi.
          example: '024027'
        nome:
          type: string
          description: Nome del comune nel periodo descritto dal record.
          example: Castegnero
        nomeStraniero:
          type: string
          nullable: true
          description: Nome nella seconda lingua ufficiale, `null` se non ne ha uno.
          example: null
        codiceCatastale:
          type: string
          nullable: true
          description: >-
            Codice catastale del comune, lo stesso per tutte le sue identità.
            `null` per i comuni, tutti cessati da molto, che non l'hanno mai
            avuto.
          example: C056
          pattern: '[A-Z]\d{3}'
        dataIstituzione:
          type: string
          format: date
          description: Data da cui il comune è stato quello descritto dal record.
          example: '1866-11-19'
        dataCessazione:
          type: string
          format: date
          description: Data fino a cui il comune è stato quello descritto dal record.
          example: '2026-02-20'
        provincia:
          $ref: '#/components/schemas/ProvinciaStorica'
        comuneAttuale:
          type: object
          nullable: true
          description: >-
            Il comune di oggi che porta lo stesso codice catastale, cioè lo
            stesso comune sotto altro nome o altra provincia. `null` quando il
            comune è stato soppresso: la fonte non dice in quale comune sia
            confluito.
          properties:
            codice:
              type: string
              description: Codice ISTAT del comune attuale.
              example: '028001'
            nome:
              type: string
              description: Nome del comune attuale.
              example: Abano Terme
            codiceCatastale:
              type: string
              description: Codice catastale del comune attuale.
              example: A001
              pattern: '[A-Z]\d{3}'
    ProvinciaStorica:
      type: object
      description: >-
        La provincia del comune quando è cessato. È quella di allora, non quella
        di oggi, e può non esistere più.
      properties:
        codice:
          type: string
          description: Codice ISTAT della provincia di allora.
          example: '024'
        nome:
          type: string
          nullable: true
          description: >-
            Nome della provincia, `null` quando non è più una di quelle che l'API
            descrive: è il caso dei territori ceduti dopo la guerra, di cui resta
            solo la sigla.
          example: Vicenza
        sigla:
          type: string
          description: Sigla della provincia di allora.
          example: VI
          pattern: '[A-Z]{2}'
        regione:
          type: string
          nullable: true
          description: >-
            Regione della provincia, `null` per i territori ceduti dopo la
            guerra.
          example: Veneto
    ComuniCessatiXML:
      type: object
      xml:
        name: comuni
      description: >-
        Come l'XML dei comuni. Un campo assente è un elemento vuoto,
        `<comuneAttuale/>`.
      properties:
        page:
          xml:
            attribute: true
          type: integer
          description: Il numero della pagina fornita.
          minimum: 1
          example: 1
        pagesize:
          xml:
            attribute: true
          type: integer
          description: La dimensione di ogni pagina.
          minimum: 1
          example: 10
        total:
          xml:
            attribute: true
          type: integer
          description: Il numero totale di entries disponibili.
          minimum: 0
          example: 11470
        comuni:
          type: array
          xml:
            name: comune
          items:
            $ref: '#/components/schemas/ComuneCessato'
    ComuniCessatiCSV:
      type: string
      description: >-
        Lista CSV delimitata da virgola, con l'header nella prima riga. I campi
        innestati diventano colonne nel formato `campo_attributo`.


        Quando la risposta contiene anche comuni soppressi compare in più una
        colonna `comuneAttuale`, sempre vuota: sono le righe senza comune attuale
        a produrla, che di sotto-colonne da riempire non ne hanno.
      example: |-
        id,codice,nome,nomeStraniero,codiceCatastale,dataIstituzione,dataCessazione,provincia_codice,provincia_nome,provincia_sigla,provincia_regione,comuneAttuale_codice,comuneAttuale_nome,comuneAttuale_codiceCatastale
        12560,028001,Abano,,A001,1866-11-19,1924-11-13,028,Padova,PD,Veneto,028001,Abano Terme,A001
    ComuniXML:
      type: object
      xml:
        name: comuni
      properties:
        page:
          xml:
            attribute: true
          type: integer
          description: Il numero della pagina fornita.
          minimum: 1
          example: 1
        pagesize:
          xml:
            attribute: true
          type: integer
          description: La dimensione di ogni pagina.
          minimum: 1
          example: 10
        total:
          xml:
            attribute: true
          type: integer
          description: Il numero totale di entries disponibili.
          minimum: 0
          example: 7894
        comuni:
          type: array
          xml:
            name: comune
          items:
            $ref: '#/components/schemas/Comune'
    ComuniXMLV5:
      allOf:
        - $ref: '#/components/schemas/ComuniXML'
        - type: object
          description: >-
            Un comune con più CAP ripete l'elemento `cap`, uno per valore.
          properties:
            comuni:
              type: array
              xml:
                name: comune
              items:
                $ref: '#/components/schemas/ComuneV5'
    ComuniCSV:
      type: string
      description: >-
        Lista CSV delimitata da virgola, con l'header nella prima riga. I campi
        innestati diventano colonne nel formato `campo_attributo`.
      example: |-
        codice,nome,nomeStraniero,codiceCatastale,cap,prefisso,provincia_nome,provincia_sigla,provincia_codice,provincia_regione,email,pec,telefono,fax,popolazione,coordinate_lat,coordinate_lng
        021008,Bolzano,Bozen,A952,39100,0471,Bolzano,BZ,021,Trentino Alto Adige,urp@comune.bolzano.it,bolzano@legalmail.it,+39 0471 997111,+39 0471 997 404,106901,46.498113,11.35478
    ComuniCSVV5:
      type: string
      description: >-
        Come il CSV della v4. I comuni con più CAP li elencano nella stessa
        colonna, separati da uno spazio.
      example: |-
        nome,cap,prefisso
        Tione di Trento,38079,0465
        Trento,38122 38121 38123,0461
    Provincia:
      type: object
      properties:
        codice:
          type: string
          description: Codice ISTAT della provincia.
          example: '021'
        nome:
          type: string
          description: Nome della provincia.
          example: Bolzano
        sigla:
          type: string
          description: Sigla della provincia (in maiuscolo).
          example: BZ
          pattern: '[A-Z]{2}'
        regione:
          type: string
          description: Regione della provincia.
          example: Trentino Alto Adige
